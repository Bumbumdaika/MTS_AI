<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energytool — консультант</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font:16px system-ui;color:#20242a}main{max-width:920px;margin:24px auto;background:white;padding:24px;border-radius:18px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px}.muted{color:#666;font-size:14px}#chat{height:50vh;overflow-y:auto;border-block:1px solid #eee;margin:16px 0;padding:12px}article{padding:12px 16px;margin:10px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f2f5}article.user{background:#fee6e7;margin-left:12%}article.assistant{margin-right:8%}button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer;background:#e30613;color:white}button.secondary{background:#eceef1;color:#20242a}button:disabled{opacity:.5;cursor:wait}form{display:flex;gap:10px}input{font:inherit;flex:1;min-width:0;padding:12px;border:1px solid #bbb;border-radius:9px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#error{color:#b00020;min-height:24px}.debug{font-size:13px;margin-top:10px;border-top:1px solid #ccd1d8;padding-top:8px;color:#4b5563}.debug summary{cursor:pointer}.debug-panel{border:1px solid #ddd;background:#fafafa;border-radius:12px;padding:12px;margin:10px 0;max-height:36vh;overflow:auto}.debug-panel article{font-size:13px;margin:6px 0}.debug-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.debug-controls label{font-size:14px}@media(max-width:600px){main{margin:0;padding:16px;border-radius:0}header{align-items:flex-start;flex-direction:column}h1{font-size:20px}#chat{height:48vh}}
</style>
<main>
  <header><h1>Energytool · ИИ-консультант</h1><button class="secondary" id="new">Новый диалог</button></header>
  <p class="muted" id="mode"></p>
  <p class="muted">Опишите задачу или оставьте заявку на связь. Бот отвечает только по предоставленной базе знаний.</p>
  <div class="debug-controls" id="debugControls" hidden>
    <label><input type="checkbox" id="showDebug"> Показывать время ответа и источники</label>
    <button class="secondary" id="sessions">История сессий</button>
  </div>
  <section class="debug-panel" id="sessionsPanel" hidden></section>
  <div id="chat" aria-live="polite"></div>
  <div class="actions"><button id="lead">Связаться с менеджером</button><button id="confirm" hidden>Подтвердить заявку</button><button class="secondary" id="cancel" hidden>Отменить сбор</button></div>
  <p class="muted" id="hint"></p>
  <form id="form"><input id="message" aria-label="Сообщение" maxlength="4000" placeholder="Опишите вашу задачу" required autocomplete="off"><button>Отправить</button></form>
  <p id="error" role="alert"></p>
</main>
<script>
let state=null,busy=false,debugEnabled=false;const $=id=>document.getElementById(id);
async function api(path,method='GET',data){const res=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state&&state.id?{'Authorization':'Bearer '+state.id}:{})},...(data?{body:JSON.stringify(data)}:{})});const result=await res.json();if(!res.ok)throw Error(result.error||'Ошибка запроса');return result}
function debugBlock(message){if(!message.debug)return null;const box=document.createElement('details');box.className='debug';const summary=document.createElement('summary');summary.textContent=`Ответ: ${message.debug.elapsed_ms} мс · документов: ${message.debug.documents.length}`;box.append(summary);if(message.debug.documents.length){const list=document.createElement('ul');for(const doc of message.debug.documents){const item=document.createElement('li');item.textContent=doc.title+(doc.score==null?'':` · релевантность: ${doc.score}`)+(doc.excerpt?`\n${doc.excerpt}`:'');list.append(item)}box.append(list)}else{const empty=document.createElement('p');empty.textContent='Релевантные документы не найдены.';box.append(empty)}return box}
function render(){const chat=$('chat');chat.replaceChildren();for(const m of state.history){const a=document.createElement('article');a.className=m.role;const text=document.createElement('div');text.textContent=(m.role==='user'?'Вы':'Бот')+'\n'+m.content;a.append(text);if(debugEnabled&&$('showDebug').checked&&m.role==='assistant'){const info=debugBlock(m);if(info)a.append(info)}chat.append(a)}chat.scrollTop=chat.scrollHeight;$('confirm').hidden=state.stage!=='confirm';$('cancel').hidden=!state.stage;$('lead').hidden=!!state.lead_id;$('hint').textContent=state.stage?'Можно продолжить консультацию: /ask ваш вопрос. /lead — заполнить заново.':'';sessionStorage.setItem('energytool-session',state.id)}
function lock(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
async function send(text){if(busy||!state)return;lock(true);$('error').textContent='';try{state=await api('/api/chat','POST',{message:text});render();$('message').value=''}catch(e){$('error').textContent=e.message}finally{lock(false);$('message').focus()}}
async function showSessions(){lock(true);try{const sessions=await api('/api/debug/sessions');const panel=$('sessionsPanel');panel.replaceChildren();for(const session of sessions){const item=document.createElement('article');const title=document.createElement('strong');title.textContent=`Сессия ${session.session_ref} · ${new Date(session.updated_at).toLocaleString()}${session.has_lead?' · есть заявка':''}`;item.append(title);for(const m of session.history){const line=document.createElement('div');line.textContent=`${m.role==='user'?'Пользователь':'Бот'}: ${m.content}`;item.append(line)}panel.append(item)}if(!sessions.length)panel.textContent='Сессий пока нет.';panel.hidden=false}catch(e){$('error').textContent=e.message}finally{lock(false)}}
$('form').onsubmit=e=>{e.preventDefault();send($('message').value)};$('lead').onclick=()=>send('/lead');$('confirm').onclick=()=>send('/confirm');$('cancel').onclick=()=>send('/cancel');$('showDebug').onchange=render;$('sessions').onclick=showSessions;
$('new').onclick=async()=>{if(busy)return;lock(true);try{state=await api('/api/sessions','POST',{});render();$('error').textContent='';$('sessionsPanel').hidden=true}catch(e){$('error').textContent=e.message}finally{lock(false)}};
(async()=>{lock(true);try{const health=await api('/api/health');debugEnabled=health.debug_enabled;$('debugControls').hidden=!debugEnabled;$('mode').textContent=health.mode==='demo'?'Демонстрационный режим: поиск по базе без языковой модели.':'Режим LLM: ответы с учётом базы знаний и текущего диалога.';const saved=sessionStorage.getItem('energytool-session');if(saved){state={id:saved};try{state=await api('/api/session')}catch{state=null}}if(!state)state=await api('/api/sessions','POST',{});render()}catch(e){$('error').textContent=e.message}finally{lock(false)}})();
</script>
</html>
