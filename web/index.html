<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energytool — консультант</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font:16px system-ui;color:#20242a}main{max-width:860px;margin:24px auto;background:white;padding:24px;border-radius:18px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px}.muted{color:#666;font-size:14px}#chat{height:52vh;overflow-y:auto;border-block:1px solid #eee;margin:16px 0;padding:12px}article{padding:12px 16px;margin:10px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f2f5}article.user{background:#fee6e7;margin-left:12%}article.assistant{margin-right:8%}button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer;background:#e30613;color:white}button.secondary{background:#eceef1;color:#20242a}button:disabled{opacity:.5;cursor:wait}form{display:flex;gap:10px}input{font:inherit;flex:1;min-width:0;padding:12px;border:1px solid #bbb;border-radius:9px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#error{color:#b00020;min-height:24px}@media(max-width:600px){main{margin:0;padding:16px;border-radius:0}header{align-items:flex-start}h1{font-size:20px}#chat{height:50vh}}
</style>
<main><header><h1>Energytool · ИИ-консультант</h1><button class="secondary" id="new">Новый диалог</button></header>
<p class="muted" id="mode"></p><p class="muted">Обсудите продукт или оставьте заявку на связь. Заявки сохраняются локально; отправка менеджеру пока не подключена.</p>
<div id="chat" aria-live="polite"></div><div class="actions"><button id="lead">Связаться с менеджером</button><button id="confirm" hidden>Подтвердить заявку</button><button class="secondary" id="cancel" hidden>Отменить сбор</button></div>
<p class="muted" id="hint"></p><form id="form"><input id="message" aria-label="Сообщение" maxlength="4000" placeholder="Введите сообщение" required autocomplete="off"><button>Отправить</button></form><p id="error" role="alert"></p></main>
<script>
let state=null,busy=false;const $=id=>document.getElementById(id);
async function api(path,method='GET',data){const res=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state?{'Authorization':'Bearer '+state.id}:{})},...(data?{body:JSON.stringify(data)}:{})});const result=await res.json();if(!res.ok)throw Error(result.error||'Ошибка запроса');return result}
function render(){const chat=$('chat');chat.replaceChildren();for(const m of state.history){const a=document.createElement('article');a.className=m.role;a.textContent=(m.role==='user'?'Вы':'Бот')+'\n'+m.content;chat.append(a)}chat.scrollTop=chat.scrollHeight;$('confirm').hidden=state.stage!=='confirm';$('cancel').hidden=!state.stage;$('lead').hidden=!!state.lead_id;$('hint').textContent=state.stage?'Можно продолжить консультацию: /ask ваш вопрос. /lead — заполнить заново.':'';sessionStorage.setItem('energytool-session',state.id)}
function lock(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
async function send(text){if(busy||!state)return;lock(true);$('error').textContent='';try{state=await api('/api/chat','POST',{message:text});render();$('message').value=''}catch(e){$('error').textContent=e.message}finally{lock(false);$('message').focus()}}
$('form').onsubmit=e=>{e.preventDefault();send($('message').value)};$('lead').onclick=()=>send('/lead');$('confirm').onclick=()=>send('/confirm');$('cancel').onclick=()=>send('/cancel');
$('new').onclick=async()=>{if(busy)return;lock(true);try{state=await api('/api/sessions','POST',{});render();$('error').textContent=''}catch(e){$('error').textContent=e.message}finally{lock(false)}};
(async()=>{lock(true);try{const health=await api('/api/health');$('mode').textContent=health.mode==='demo'?'Демонстрационный режим: поиск по базе без языковой модели.':'Режим LLM: ответы с учётом базы знаний и истории.';const saved=sessionStorage.getItem('energytool-session');if(saved){state={id:saved};try{state=await api('/api/session')}catch{state=null}}if(!state)state=await api('/api/sessions','POST',{});render()}catch(e){$('error').textContent=e.message}finally{lock(false)}})();
</script></html>
